name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Ejecutar Analisis Completo
        shell: powershell
        run: |
          dotnet tool install --global dotnet-sonarscanner
          
          # Agregar la ruta de herramientas globales al ambiente actual de PowerShell
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          
          # Iniciar el escáner desde la raíz global
          dotnet sonarscanner begin /k:"luisarmandoalk_AsisyaAppRepository_dec8602d-4616-46b5-b5de-e5766fac0b91" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}"
          
          # Compilar forzando que los archivos temporales se guarden en la raíz global compartida
          dotnet build Asisya.ProductsApi/Asisya.ProductsApi.csproj /t:Rebuild /p:UseSharedCompilation=false /p:HasSharedItems=false /p:SonarQubeTargetsFilePath="$env:GITHUB_WORKSPACE\.sonarqube\bin\targets"
          
          # Finalizar el escáner leyendo la raíz global unificada
          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
