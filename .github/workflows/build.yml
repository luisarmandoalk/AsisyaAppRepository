name: SonarQube Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'   # Ajusta según tu versión

      - name: Restore dependencies
        run: dotnet restore Asisya.ProductsApi/Asisya.ProductsApi.csproj

      - name: Build
        run: dotnet build Asisya.ProductsApi/Asisya.ProductsApi.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Asisya.ProductsApi/Asisya.ProductsApi.csproj --no-build --configuration Release --verbosity normal

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet sonarscanner begin \
            /k:"Asisya.ProductsApi" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.login="${SONAR_TOKEN}"
          dotnet build Asisya.ProductsApi/Asisya.ProductsApi.csproj --configuration Release
          dotnet sonarscanner end /d:sonar.login="${SONAR_TOKEN}"
